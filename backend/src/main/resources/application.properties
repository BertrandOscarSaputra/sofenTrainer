spring.application.name=backend

# Load local environment variables before any placeholders are resolved.
spring.config.import=optional:file:./.env.local[.properties],optional:file:./.env[.properties]

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================
# For local development, copy .env.example to .env.local and fill in values
# Spring Boot resolves these from the local env loader before bean creation
# =============================================================================

# Database (MySQL) - Configuration from .env.local or environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/trainer?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Spring AI — Google Gemini
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads
app.upload.url=/api/uploads


# Server
server.port=3535
# Increase max payload size for profile pictures (Base64)
spring.codec.max-in-memory-size=10MB
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-post-size=10MB

# Security - JWT Configuration
# These values are loaded from .env.local file or system environment variables
# Required: JWT_SECRET (256-bit BASE64), JWT_EXPIRATION_MINUTES
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
